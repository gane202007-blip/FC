<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shopping Cart | Ladies Fancy Store</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="page-loader" id="pageLoader"><div class="spinner"></div></div>

  <header class="site-header">
    <div class="container header-inner">
      <a href="index.html" class="brand">
        <img src="images/logo.png" alt="Ladies Fancy Store" class="brand-logo" />
        <span>
          <span class="brand-name">Ladies Fancy</span>
          <span class="brand-subtitle">Elegance Redefined</span>
        </span>
      </a>
      <button class="nav-toggle" id="navToggle" type="button" aria-expanded="false">☰ Menu</button>
      <nav class="nav-bar" id="mainNav">
        <a href="index.html">Home</a>
        <a href="products.html">Products</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
      </nav>
      <div class="header-actions">
        <a href="cart.html" class="icon-btn" aria-label="Shopping cart">
          🛒
          <span class="cart-badge hidden" id="cartBadge">0</span>
        </a>
      </div>
    </div>
  </header>

  <main>
    <section class="page-hero">
      <div class="container">
        <p class="eyebrow">Your Bag</p>
        <h1>Shopping Cart</h1>
        <p>Review your items and proceed to checkout.</p>
      </div>
    </section>

    <div class="container cart-layout">
      <section>
        <div id="cartItems"></div>
        <div class="empty-state" id="cartEmpty">
          <p>Your cart is empty.</p>
          <a href="products.html" class="btn btn-primary" style="margin-top: 1rem;">Continue Shopping</a>
        </div>
      </section>

      <aside class="cart-summary hidden" id="cartSummary">
        <h2>Order Summary</h2>
        <div class="summary-row">
          <span>Subtotal</span>
          <span id="subtotal">₹0</span>
        </div>
        <div class="summary-row">
          <span>Shipping</span>
          <span>Free</span>
        </div>
        <div class="summary-row total">
          <span>Total</span>
          <span id="grandTotal">₹0</span>
        </div>
        <a href="https://wa.me/919876543210" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">Checkout via WhatsApp</a>
        <button class="btn btn-outline" id="clearCartBtn" type="button" style="width: 100%; margin-top: 0.75rem;">Clear Cart</button>
      </aside>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container footer-bottom">
      <p>&copy; 2026 Ladies Fancy Store. All rights reserved.</p>
    </div>
  </footer>

  <script src="js/cart.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
