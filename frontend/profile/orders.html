<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Orders | Ladies Fancy Store</title>

    <link rel="stylesheet" href="profile.css">

    <!-- Font Awesome -->
    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>

<div class="orders-container">

    <div class="page-title">
        <h1>My Orders</h1>
        <p>Track and manage all your purchases.</p>
    </div>

    <p id="ordersMessage" class="address-message" role="status" aria-live="polite">Loading your orders...</p>
    <div id="ordersList" aria-busy="true"></div>
    <p id="ordersEmpty" class="address-empty" hidden>You have not placed any orders yet.</p>

</div>

<script src="../js/api.js"></script>
<script src="../js/wishlist-api.js"></script>
<script src="orders.js"></script>

</body>
