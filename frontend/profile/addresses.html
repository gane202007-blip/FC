<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saved Addresses | Ladies Fancy Store</title>

    <link rel="stylesheet" href="profile.css">
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>

    <div class="profile-container">

        <!-- Sidebar -->
        <aside class="sidebar">

            <div class="profile-user">
                <img src="https://i.pravatar.cc/150?img=47" alt="User">
                <h3>Ganesh</h3>
                <p>ganesh@email.com</p>
            </div>

            <ul class="menu">
                <li>
                    <a href="profile.html">
                        <i class="fas fa-user"></i>
                        My Profile
                    </a>
                </li>

                <li>
                    <a href="orders.html">
                        <i class="fas fa-box"></i>
                        Orders
                    </a>
                </li>

                <li class="active">
                    <a href="addresses.html">
                        <i class="fas fa-location-dot"></i>
                        Addresses
                    </a>
                </li>

                <li>
                    <a href="wishlist.html">
                        <i class="fas fa-heart"></i>
                        Wishlist
                    </a>
                </li>

                <li>
                    <a href="#" id="logoutBtn">
                        <i class="fas fa-right-from-bracket"></i>
                        Logout
                    </a>
                </li>

            </ul>

        </aside>

        <!-- Main Content -->

        <main class="content">

            <div class="page-header">

                <h2>Saved Addresses</h2>

                <button class="add-address-btn" id="addAddressBtn" type="button">
                    <i class="fas fa-plus"></i>
                    Add New Address
                </button>

            </div>

            <p id="addressMessage" class="address-message" role="status" aria-live="polite"></p>
            <div id="addressesContainer"></div>

        </main>

    </div>

    <div class="modal" id="addressModal" aria-hidden="true">
        <div class="modal-content address-modal-content" role="dialog" aria-modal="true"
            aria-labelledby="addressModalTitle">
            <button class="close-btn" id="closeAddressModal" type="button"
                aria-label="Close address form">&times;</button>
            <h2 id="addressModalTitle">Add New Address</h2>

            <form class="address-form" id="addressForm">
                <div class="form-group">
                    <label for="addressFullName">Full Name</label>
                    <input id="addressFullName" name="fullName" type="text" autocomplete="name" required>
                </div>
                <div class="form-group">
                    <label for="addressPhone">Phone</label>
                    <input id="addressPhone" name="phone" type="tel" autocomplete="tel" required>
                </div>
                <div class="form-group">
                    <label for="addressStreet">Street Address</label>
                    <textarea id="addressStreet" name="street" rows="3" autocomplete="street-address" required></textarea>
                </div>
                <div class="form-group">
                    <label for="addressCity">City</label>
                    <input id="addressCity" name="city" type="text" autocomplete="address-level2" required>
                </div>
                <div class="form-group">
                    <label for="addressState">State</label>
                    <input id="addressState" name="state" type="text" autocomplete="address-level1" required>
                </div>
                <div class="form-group">
                    <label for="addressPincode">Pincode</label>
                    <input id="addressPincode" name="pincode" type="text" inputmode="numeric"
                        autocomplete="postal-code" required>
                </div>
                <div class="form-group">
                    <label for="addressType">Address Type</label>
                    <select id="addressType" name="type">
                        <option value="Home">Home</option>
                        <option value="Office">Office</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
                <div class="form-group address-default-option">
                    <label>
                        <input name="isDefault" type="checkbox">
                        Set as default address
                    </label>
                </div>
                <div class="address-form-actions">
                    <button class="save-btn" type="submit">Save Address</button>
                    <button class="edit-btn" id="cancelAddressForm" type="button">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <script src="../js/api.js" defer></script>
    <script src="addresses.js" defer></script>

</body>

</html>
