<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wishlist | Ladies Fancy Store</title>

    <link rel="stylesheet" href="profile.css">
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>

<div class="profile-container">

    <!-- Sidebar -->

    <aside class="sidebar">

        <div class="profile-user">
            <img src="https://i.pravatar.cc/150?img=47">
            <h3 id="wishlistUserName">My Account</h3>
            <p id="wishlistUserEmail"></p>
        </div>

        <ul class="menu">

            <li>
                <a href="profile.html">
                    <i class="fas fa-user"></i>
                    My Profile
                </a>
            </li>

            <li>
                <a href="orders.html">
                    <i class="fas fa-box"></i>
                    Orders
                </a>
            </li>

            <li>
                <a href="addresses.html">
                    <i class="fas fa-location-dot"></i>
                    Addresses
                </a>
            </li>

            <li class="active">
                <a href="wishlist.html">
                    <i class="fas fa-heart"></i>
                    Wishlist
                </a>
            </li>

            <li>
                <a href="#">
                    <i class="fas fa-right-from-bracket"></i>
                    Logout
                </a>
            </li>

        </ul>

    </aside>

    <!-- Content -->

    <main class="content">

        <div class="page-header">

            <h2>My Wishlist</h2>

        </div>

        <p id="wishlistStatus" class="address-message" role="status" aria-live="polite">Loading wishlist...</p>
        <div class="wishlist-grid" id="wishlistGrid" aria-busy="true"></div>
        <p id="wishlistEmpty" class="address-empty hidden">Your wishlist is empty. Browse products to add your favourites.</p>

    </main>

</div>


<script src="../js/api.js"></script>
<script src="../js/cart.js"></script>
<script src="../js/wishlist-api.js"></script>
<script src="wishlist.js"></script>

</body>

</html>
