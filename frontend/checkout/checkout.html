<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Checkout | Ladies Fancy Store</title>

    <link rel="stylesheet" href="checkout.css">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>

    <!-- Header -->

    <header class="checkout-header">

        <div class="logo">
            <a href="../index.html">Ladies Fancy Store</a>
        </div>

        <div class="checkout-title">
            Checkout
        </div>

    </header>



    <!-- Progress -->

    <section class="progress-section">

        <div class="step active">
            <span>1</span>
            <p>Address</p>
        </div>

        <div class="line active"></div>

        <div class="step">
            <span>2</span>
            <p>Payment</p>
        </div>

        <div class="line"></div>

        <div class="step">
            <span>3</span>
            <p>Success</p>
        </div>

    </section>



    <main class="checkout-container">

        <!-- Left -->

        <section class="left-section">

            <!-- Address -->

            <div class="checkout-card">

                <div class="card-header">

                    <h2>
                        Delivery Address
                    </h2>

                    <button class="add-address-btn" id="addCheckoutAddressBtn" type="button">
                        + Add New
                    </button>

                </div>

                <div id="checkoutAddresses" aria-busy="true"></div>

            </div>



            <!-- Products -->

            <div class="checkout-card">

                <h2>Your Items</h2>

                <div id="checkoutItems" aria-busy="true"></div>

            </div>

        </section>





        <!-- Right -->

        <aside class="right-section">

            <!-- Coupon -->

            <div class="checkout-card">

                <h2>Coupon</h2>

                <div class="coupon-box">

                    <input
                        type="text"
                        placeholder="Enter Coupon Code">

                    <button id="applyCouponBtn" type="button">
                        Apply
                    </button>

                </div>

            </div>



            <!-- Price Details -->

            <div class="checkout-card">

                <h2>Price Details</h2>

                <div class="price-row">
                    <span>Subtotal</span>
                    <span id="checkoutSubtotal">₹0</span>
                </div>

                <div class="price-row">
                    <span>Shipping</span>
                    <span>FREE</span>
                </div>

                <div class="price-row">
                    <span>Discount</span>
                    <span id="checkoutDiscount">-₹0</span>
                </div>

                <hr>

                <div class="price-row total">

                    <span>Total</span>

                    <span id="checkoutTotal">₹0</span>

                </div>

                <button class="payment-btn" id="placeOrderBtn" type="button" disabled>
                    Place Order (Cash on Delivery)
                </button>
                <p id="checkoutMessage" class="checkout-message" role="status" aria-live="polite"></p>
                <div id="checkoutSuccess" hidden>
                    <p>Order placed successfully. Your order ID is <strong id="successOrderId"></strong>.</p>
                    <a href="../profile/orders.html">View your orders</a>
                </div>

            </div>

        </aside>

    </main>

    <script src="../js/api.js"></script>
    <script src="../js/wishlist-api.js"></script>
    <script src="checkout.js"></script>
</body>

</html>
