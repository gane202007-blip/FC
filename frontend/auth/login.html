<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Ladies Fancy Store</title>

    <!-- Font Awesome -->
    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <!-- Authentication CSS -->
    <link rel="stylesheet" href="auth.css">
</head>

<body>

<div class="auth-container">

    <div class="auth-card">

        <!-- Logo -->

        <div class="logo">

            <img src="../../images/logo.png" alt="Logo">

            <h2>Ladies Fancy Store</h2>

            <p>Welcome Back</p>

        </div>

        <!-- Login Form -->

        <form id="loginForm">

            <!-- Email -->

            <div class="input-group">

                <i class="fa-solid fa-envelope"></i>

                <input
                    type="email"
                    id="loginEmail"
                    placeholder="Email Address"
                    required>

            </div>

            <!-- Password -->

            <div class="input-group password-group">

                <i class="fa-solid fa-lock"></i>

                <input
                    type="password"
                    id="loginPassword"
                    placeholder="Password"
                    required>

                <span class="toggle-password">
                    <i class="fa-solid fa-eye"></i>
                </span>

            </div>

            <!-- Remember -->

            <div class="options">

                <label>

                    <input type="checkbox" id="rememberMe">

                    Remember Me

                </label>

                <a href="forgot-password.html">
                    Forgot Password?
                </a>

            </div>

            <!-- Login Button -->

            <button type="submit" class="btn">

                Login

            </button>

        </form>

        <!-- Divider -->

        <div class="divider">

            <span>OR</span>

        </div>

        <!-- Signup -->

        <p class="bottom-text">

            Don't have an account?

            <a href="signup.html">

                Sign Up

            </a>

        </p>

    </div>

</div>



    <!-- Other HTML content -->

    <script src="../js/api.js"></script>
    <script src="auth.js"></script>

    <script>
    const form = document.getElementById("loginForm");

    if (form) {

        form.addEventListener("submit", async function(e) {
            e.preventDefault();

            const email = document.getElementById("loginEmail").value.trim();
            const password = document.getElementById("loginPassword").value;
            const remember = document.getElementById("rememberMe").checked;

            const result = await window.API.request("/auth/login", {
                method: "POST",
                body: { email, password }
            });

            if (!result.success || !result.token || !result.user) {
                alert(result.message || "Login failed. Please try again.");
                return;
            }

            window.API.setToken(result.token);
            window.API.setUser(result.user);

            if (remember) {
                localStorage.setItem("rememberEmail", email);
            } else {
                localStorage.removeItem("rememberEmail");
            }

            window.location.href = result.user.role === "admin"
                ? "../admin/products.html"
                : "../profile/profile.html";
        });

    }
    </script>

</body>
</html>
